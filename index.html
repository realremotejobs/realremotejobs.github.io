const categoryGroups = document.getElementById("categoryGroups");
const categoryFilter = document.getElementById("categoryFilter");
const locationFilter = document.getElementById("locationFilter");
const searchFilter = document.getElementById("searchFilter");

const categoryIcons = {
  "Customer Support Jobs": "images/customer-support-icon.png",
  "Technical & Operations Jobs": "images/technical-icon.png",
  "No Phone Jobs": "images/no-phone-icon.png",
  "Content & Education Jobs": "images/content-education-icon.png",
  "Customer Success Jobs": "images/customer-success-icon.png"
};

function getCategorySubtitle(category){
  const subtitles = {
    "Customer Support Jobs": "Phone, chat, email, and customer care roles",
    "Technical & Operations Jobs": "Tech support, operations, and platform support",
    "No Phone Jobs": "Writing, admin, curriculum, and non-phone roles",
    "Content & Education Jobs": "Curriculum, teaching support, and content creation",
    "Customer Success Jobs": "Client support, onboarding, and account growth"
  };

  return subtitles[category] || "Remote job opportunities";
}

function populateCategoryFilter(){
  const categories = [...new Set(jobs.map(job => job.category))].sort();

  categories.forEach(category => {
    const option = document.createElement("option");
    option.value = category;
    option.textContent = category;
    categoryFilter.appendChild(option);
  });
}

function filterJobs(){
  const selectedCategory = categoryFilter.value;
  const selectedLocation = locationFilter.value.toLowerCase();
  const searchText = searchFilter.value.toLowerCase().trim();

  return jobs.filter(job => {
    const matchesCategory = selectedCategory === "all" || job.category === selectedCategory;
    const matchesLocation = selectedLocation === "all" || job.type.toLowerCase().includes(selectedLocation);
    const matchesSearch =
      job.title.toLowerCase().includes(searchText) ||
      job.company.toLowerCase().includes(searchText) ||
      job.description.toLowerCase().includes(searchText);

    return matchesCategory && matchesLocation && matchesSearch;
  });
}

function renderJobs(){
  const filteredJobs = filterJobs();
  categoryGroups.innerHTML = "";

  if(filteredJobs.length === 0){
    categoryGroups.innerHTML = `<div class="empty-message">No jobs match your filters right now. Try changing the category, location, or search term.</div>`;
    return;
  }

  const groupedJobs = filteredJobs.reduce((groups, job) => {
    if(!groups[job.category]){
      groups[job.category] = [];
    }
    groups[job.category].push(job);
    return groups;
  }, {});

  Object.keys(groupedJobs).forEach((category, categoryIndex) => {
    const card = document.createElement("div");
    card.className = "category-card";

    const iconSrc = categoryIcons[category] || "images/filter-icon.png";

    const listingsHTML = groupedJobs[category].map((job, index) => {
      const detailsId = `details-${categoryIndex}-${index}`;

      return `
        <div class="listing-row">
          <div class="job-title">${job.title}</div>
          <div class="company-name">${job.company}</div>
          <div class="listing-meta">${job.type} • Posted ${job.postedDate} • ${job.status}</div>
          <div class="job-actions">
            <a class="apply-btn" href="${job.link}" target="_blank" rel="noopener noreferrer">Apply →</a>
            <button class="job-toggle-btn" type="button" data-details="${detailsId}">➕ View Details</button>
          </div>
          <div id="${detailsId}" class="job-details">${job.description}</div>
        </div>
      `;
    }).join("");

    card.innerHTML = `
      <div class="category-heading">
        <img src="${iconSrc}" class="category-icon-img" alt="">
        <div>
          <h3>${category}</h3>
          <div class="category-subtitle">${getCategorySubtitle(category)}</div>
        </div>
      </div>

      <button class="view-listings-btn" type="button">
        <span>View Listings (${groupedJobs[category].length})</span>
        <span>+</span>
      </button>

      <div class="toggle-section">
        <div class="listing-list">
          ${listingsHTML}
        </div>
      </div>
    `;

    categoryGroups.appendChild(card);
  });

  document.querySelectorAll(".view-listings-btn").forEach(button => {
    button.addEventListener("click", () => {
      const section = button.nextElementSibling;
      const icon = button.querySelector("span:last-child");
      section.classList.toggle("show");
      icon.textContent = section.classList.contains("show") ? "−" : "+";
    });
  });

  document.querySelectorAll(".job-toggle-btn").forEach(button => {
    button.addEventListener("click", () => {
      const details = document.getElementById(button.dataset.details);
      details.classList.toggle("show");
      button.textContent = details.classList.contains("show") ? "▲ Hide Details" : "➕ View Details";
    });
  });
}

categoryFilter.addEventListener("change", renderJobs);
locationFilter.addEventListener("change", renderJobs);
searchFilter.addEventListener("input", renderJobs);

populateCategoryFilter();
renderJobs();
</script>

</body>
</html>
